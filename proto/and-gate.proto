syntax = "proto3";

package time;

option go_package = "and-gate/v2/pb";


service StartService {
  rpc GetStartNanos(GetStartNanosRequest) returns (GetStartNanosResponse);
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
}


message StopServerRequest {}
message StopServerResponse {}



message GetStartNanosRequest {}


message GetStartNanosResponse {
  int64 start_nanos = 1;
}